{% set name = "llama-index-instrumentation" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llama_index_instrumentation-{{ version }}.tar.gz
  sha256: b185c4e28a7f32899c27649cc2e2d7d54267fa2ff0cd43cbe2b5212bae98fe3a

build:
  number: 0
  skip: true  # [py<310]
  # mirrors the console_scripts entry in the upstream wheel
  entry_points:
    - llama-index-instrumentation = llama_index_instrumentation:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - deprecated >=1.2.18
    - pydantic >=2.11.5

# test_aevent_concurrent_handlers asserts <15ms async handler latency; Windows workers take 20-60ms (AnacondaRecipes/llama-index-instrumentation-feedstock#3)
{% set deselect_tests = "" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_dispatcher.py::test_aevent_concurrent_handlers" %}  # [win]

test:
  source_files:
    - tests
  imports:
    - llama_index_instrumentation
  commands:
    - python -m pytest -vv tests{{ deselect_tests }}
    - pip check
  requires:
    - pip
    - pytest
    - pytest-asyncio

about:
  home: https://github.com/run-llama/llama_index
  summary: This project provides the instrumentation hooks for observability in LlamaIndex.
  description: |
    This project provides the instrumentation hooks for observability in
    LlamaIndex. Instrumentation uses a mix of spans, events, and dispatches
    that manage span and event handlers.
  license: MIT
  license_file: LICENSE
  license_family: MIT
  doc_url: https://developers.llamaindex.ai/python/framework/module_guides/observability/instrumentation/
  dev_url: https://github.com/run-llama/llama_index/tree/main/llama-index-instrumentation

extra:
  recipe-maintainers:
    - jan-janssen
