{% set name = "llama-index-instrumentation" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llama_index_instrumentation-{{ version }}.tar.gz
  sha256: b185c4e28a7f32899c27649cc2e2d7d54267fa2ff0cd43cbe2b5212bae98fe3a

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - deprecated >=1.2.18
    - pydantic >=2.11.5

test:
  imports:
    - llama_index_instrumentation
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/run-llama/llama_index
  summary: This project provides the instrumentation hooks for observability in LlamaIndex.
  description: |
    This project provides the instrumentation hooks for observability in
    LlamaIndex. Instrumentation uses a mix of spans, events, and dispatches
    that manage span and event handlers.
  license: MIT
  license_file: LICENSE
  license_family: MIT
  doc_url: https://developers.llamaindex.ai/python/framework/module_guides/observability/instrumentation/
  dev_url: https://github.com/run-llama/llama_index/tree/main/llama-index-instrumentation

extra:
  recipe-maintainers:
    - jan-janssen
